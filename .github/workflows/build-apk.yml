
name: Build Distortion Labs IPTV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extraer proyecto ZIP
        run: |
          if [ ! -f distortion_labs_iptv.zip ]; then
            echo "ERROR: No se encuentra distortion_labs_iptv.zip"
            exit 1
          fi
          mkdir -p extracted
          unzip -oq distortion_labs_iptv.zip -d extracted
          echo "Contenido del ZIP:"
          find extracted -maxdepth 3 -type f | head -80

      - name: Buscar Gradle Wrapper
        id: wrapper
        run: |
          WRAPPER=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: El ZIP no contiene gradlew."
            echo "Hay que revisar si incluye el proyecto Android completo."
            exit 1
          fi
          chmod +x "$WRAPPER"
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: .
        run: |
          cd "${{ steps.wrapper.outputs.dir }}"
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Distortion-Labs-IPTV-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
