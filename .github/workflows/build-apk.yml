
name: Build Distortion Labs IPTV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'distortion_labs_iptv.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extraer proyecto
        run: |
          mkdir -p src
          unzip -o distortion_labs_iptv.zip -d src
          echo "Archivos del proyecto:"
          find src -name pubspec.yaml

      - name: Encontrar proyecto Flutter
        id: project
        shell: bash
        run: |
          FILE=$(find src -name pubspec.yaml -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: No se encontró pubspec.yaml dentro del ZIP"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $DIR"

      - name: Crear estructura Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter create --org com.distortionlabs --project-name distortion_labs_iptv .

      - name: Configurar Android API 36
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE_FILE"
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "ERROR: No se encontró el archivo Gradle de la aplicación"
            exit 1
          fi
          grep -n 'compileSdk' android/app/build.gradle* || true

      - name: Descargar dependencias
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: distortion-labs-iptv-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
