name: Build Distortion Labs IPTV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Dar permisos a Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          elif [ -f gradle ]; then
            echo "ERROR: No se encontró el archivo gradlew"
            exit 1
          else
            echo "ERROR: Falta el Gradle Wrapper"
            exit 1
          fi

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Distortion-Labs-IPTV-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
